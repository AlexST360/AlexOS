<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AlexOS — Acceso</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/design-system.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/layout.css" />

  <style>
    /* Orbs grandes con animación */
    .orbs { position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden; }
    .orb  { position:absolute;border-radius:50%;filter:blur(110px); }
    .orb-1 { width:800px;height:800px; background:radial-gradient(circle,rgba(200,168,75,0.18),transparent 70%); top:-250px;left:-250px; }
    .orb-2 { width:700px;height:700px; background:radial-gradient(circle,rgba(26,92,69,0.12),transparent 70%); bottom:-200px;right:-200px; }
    .orb-3 { width:500px;height:500px; background:radial-gradient(circle,rgba(217,110,50,0.09),transparent 70%); top:45%;left:55%;transform:translate(-50%,-50%); }

    /* Grid de fondo */
    .bg-grid {
      position:fixed;inset:0;
      background-image:
        linear-gradient(rgba(200,168,75,0.035) 1px,transparent 1px),
        linear-gradient(90deg,rgba(200,168,75,0.035) 1px,transparent 1px);
      background-size:72px 72px;
      pointer-events:none;z-index:0;
    }

    /* Separador con texto */
    .sep-text {
      display:flex;align-items:center;gap:var(--sp-3);
      color:var(--text-4);font-size:var(--text-xs);
    }
    .sep-text::before,.sep-text::after {
      content:'';flex:1;height:0.5px;background:rgba(20,16,10,0.07);
    }

    /* Input label */
    .form-label {
      display:block;font-size:var(--text-xs);font-weight:600;
      letter-spacing:0.08em;text-transform:uppercase;color:var(--text-3);
      margin-bottom:6px;
    }

    /* Módulos preview */
    .mod-pill {
      display:flex;align-items:center;gap:5px;
      padding:6px 12px;border-radius:var(--r-full);
      font-size:var(--text-xs);font-weight:500;color:var(--text-2);
      background:rgba(255,253,248,0.60);
      backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
      border:0.5px solid rgba(255,255,255,0.60);
      box-shadow:0 1px 0 rgba(255,255,255,0.80) inset, 0 2px 8px rgba(20,16,10,0.04);
      cursor:default;
    }

    /* Version chip */
    .version-chip {
      font-family:var(--font-mono);font-size:10px;color:var(--text-5);
      background:rgba(20,16,10,0.04);border:0.5px solid rgba(20,16,10,0.07);
      padding:2px 7px;border-radius:var(--r-full);
    }
  </style>
</head>
<body>

<div class="orbs" aria-hidden="true">
  <div class="orb orb-1 orb-a"></div>
  <div class="orb orb-2 orb-b"></div>
  <div class="orb orb-3 orb-c"></div>
</div>
<div class="bg-grid" aria-hidden="true"></div>

<main class="landing" style="position:relative;z-index:1;">
  <div style="width:100%;max-width:420px;display:flex;flex-direction:column;gap:var(--sp-8);">

    <!-- Marca arriba -->
    <div style="text-align:center;">
      <div style="display:flex;align-items:center;justify-content:center;gap:var(--sp-3);margin-bottom:var(--sp-3);">
        <div class="sunset-stripe" style="width:32px;opacity:0.8;"></div>
        <span class="version-chip">v0.14.0 · Beta</span>
        <div class="sunset-stripe" style="width:32px;opacity:0.8;"></div>
      </div>
      <h1 style="font-family:var(--font-serif);font-size:60px;font-weight:300;background:linear-gradient(145deg,var(--gold-4),var(--gold),var(--gold-2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:0.02em;line-height:1.05;margin-bottom:var(--sp-2);">
        AlexOS
      </h1>
      <p style="font-family:var(--font-serif);font-size:var(--text-md);color:var(--text-3);font-style:italic;font-weight:300;">
        Tu sistema operativo personal
      </p>
    </div>

    <!-- Módulos preview -->
    <div style="display:flex;flex-wrap:wrap;gap:7px;justify-content:center;">
      <div class="mod-pill">DayOS</div>
      <div class="mod-pill">WealthOS</div>
      <div class="mod-pill">ProjectOS</div>
      <div class="mod-pill">Second Brain</div>
    </div>

    <!-- Card de login -->
    <div class="landing-card">
      <!-- Header -->
      <div style="margin-bottom:var(--sp-1);">
        <h2 style="font-family:var(--font-serif);font-size:var(--text-xl);font-weight:400;color:var(--text);margin-bottom:3px;">Bienvenido de vuelta</h2>
        <p style="font-size:var(--text-sm);color:var(--text-3);">Inicia sesión en tu sistema</p>
      </div>

      <form style="display:flex;flex-direction:column;gap:var(--sp-3);" onsubmit="handleLogin(event)">
        <div>
          <label class="form-label">Correo electrónico</label>
          <input class="input-glass" type="email" placeholder="alex@alexos.app" value="alex@alexos.app" autocomplete="email" />
        </div>
        <div>
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
            <label class="form-label" style="margin-bottom:0;">Contraseña</label>
            <a href="#" style="font-size:var(--text-xs);color:var(--text-3);text-decoration:none;transition:color var(--t-base);" onmouseover="this.style.color='var(--gold)'" onmouseout="this.style.color='var(--text-3)'">¿Olvidaste?</a>
          </div>
          <input class="input-glass" type="password" placeholder="••••••••" value="password" autocomplete="current-password" />
        </div>

        <div style="display:flex;align-items:center;gap:var(--sp-2);padding:var(--sp-1) 0;">
          <div class="toggle active" id="remember-toggle"></div>
          <span style="font-size:var(--text-xs);color:var(--text-3);">Mantener sesión iniciada</span>
        </div>

        <button type="submit" id="login-btn" class="btn btn-primary btn-xl" style="width:100%;margin-top:var(--sp-1);">
          ✦ Entrar a AlexOS
        </button>
      </form>

      <div class="sep-text">O continúa con</div>

      <div style="display:flex;gap:var(--sp-3);">
        <button class="btn btn-glass" style="flex:1;">
          <svg width="16" height="16" viewBox="0 0 24 24"><path fill="currentColor" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
          Google
        </button>
        <button class="btn btn-glass" style="flex:1;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/></svg>
          Apple
        </button>
      </div>

      <p style="text-align:center;font-size:var(--text-xs);color:var(--text-5);">
        Acceso privado · Solo para Alex Soto
      </p>
    </div>

  </div>
</main>

<script>
  /* Toggle de recordar sesión */
  document.getElementById('remember-toggle').addEventListener('click', function() {
    this.classList.toggle('active');
  });

  /* Login → redirige al app */
  function handleLogin(e) {
    e.preventDefault();
    const btn = document.getElementById('login-btn');
    btn.innerHTML = '<span class="spinner"></span> Entrando…';
    btn.disabled = true;
    setTimeout(() => { window.location.href = 'app.html#dayos'; }, 900);
  }
</script>
</body>
</html>
